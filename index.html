<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shikakuLog サポート</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8f8f8;
      --border: #ececec;
      --text: #1c2a3a;
      --muted: #737373;
      --accent: #2f6f63;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121413;
        --card: #1c1f1e;
        --border: #2a2e2c;
        --text: #f2f4f3;
        --muted: #9aa19e;
        --accent: #57a393;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      line-height: 1.9;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
    .brand { font-weight: 700; font-size: 24px; letter-spacing: 0.02em; }
    .brand .log { color: var(--accent); }
    .tagline { color: var(--muted); margin-top: 4px; }
    h2 { font-size: 19px; margin: 40px 0 12px; padding-left: 12px; border-left: 4px solid var(--accent); }
    p, li { font-size: 15.5px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0;
    }
    a { color: var(--accent); }
    footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">shikaku<span class="log">Log</span></div>
    <p class="tagline">資格取得を、もっとシンプルに。</p>

    <h2>アプリについて</h2>
    <p>
      shikakuLog は、保有資格・勉強中の資格・受験予定の資格をシンプルに管理できる資格管理アプリです。
      データはすべて端末内に保存され、オフラインでご利用いただけます。
    </p>

    <h2>お問い合わせ</h2>
    <div class="card">
      <p>ご意見・ご要望・不具合のご報告は、メールでお気軽にご連絡ください。</p>
      <p>メール: <a href="mailto:shikakulog@gmail.com">shikakulog@gmail.com</a></p>
    </div>

    <h2>プライバシーポリシー・利用規約</h2>
    <p><a href="./privacy.html">プライバシーポリシー</a> / <a href="./terms.html">利用規約</a></p>

    <footer>© 2026 shikakuLog</footer>
  </main>
</body>
</html>
